name: Compilar APK Android
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Crear estructura Android nativa
        run: flutter create . --project-name argon_pc_commander --platforms android
      - name: Compilar APK
        run: flutter build apk --release
      - name: Empaquetar APK para descarga movil
        uses: actions/upload-artifact@v4
        with:
          name: Argon-PC-Commander-APK
          path: build/app/outputs/flutter-apk/app-release.apk
